[project]
name = "pixel-battle"
version = "0.1.0"
description = "100% local AI/ML r/place simulation with PyTorch MPS agents, Ollama Qwen2.5-VL faction diplomacy, and hybrid pixel-art diffusion morphing."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.5.0",
    "numpy>=2.0.0",
    "pillow>=11.0.0",
    "scipy>=1.14.0",
    "diffusers>=0.32.0",
    "transformers>=4.47.0",
    "accelerate>=1.2.0",
    "peft>=0.14.0",
    "safetensors>=0.4.5",
    "httpx>=0.28.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "mflux>=0.24.0",
]

[project.scripts]
pixel-battle = "pixel_battle.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixel_battle"]
